<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Imran Khan</title>
    <link rel="stylesheet" href="stylesheet/style.css">
    <link rel="icon" href="images/favi.png">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header>
        <nav>
            <ul class="nav">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section" data-aos="fade-up">
            <h1>Contact Me</h1>

            <form class="contact-form" action="https://formspree.io/f/xojjlove" method="POST">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="_replyto" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
            <p id="success-message" style="display:none; color:green; margin-top:1rem;">
                Thank you! Your message has been sent.
            </p>
        </section>
    </main>

    <footer>
        <p>© 2026 Imran Khan Front End Developer</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });
    </script>
</body>

</html>
